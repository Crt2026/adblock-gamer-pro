plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bloqueador.anuncios'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bloqueador.anuncios'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
