name: Compilar APK v5.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Preparar archivo APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AdblockGamerPro-v5.4.apk

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AdblockGamerPro-v5.4-apk
          path: AdblockGamerPro-v5.4.apk
